[package]
name = "rust-attester"
version = "0.1.0"
edition = "2024"

[dependencies]
appattest-rs = { path = "vendor/appattest-rs" }
axum = "0.8"
base64 = "0.22"
http = "1"
p256 = "0.13"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "migrate", "macros"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
ciborium = "0.2"
